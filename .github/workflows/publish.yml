name: Publish to PowerShell Gallery

on:
  workflow_dispatch:

env:
  PSGALLERY_MODULE_NAME: git-aliases

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -AllowClobber

      - name: Run unit tests
        shell: pwsh
        run: |
          Invoke-Pester ./tests -Output Minimal -CI

      - name: Check version not already published
        shell: pwsh
        run: |
          $manifestVersion = (Import-PowerShellDataFile ./src/git-aliases.psd1).ModuleVersion
          $published = Find-PSResource -Name $env:PSGALLERY_MODULE_NAME -ErrorAction SilentlyContinue |
            Where-Object { $_.Version -eq $manifestVersion }
          if ($published) {
            throw "Version $manifestVersion is already published to the PowerShell Gallery."
          }

      - name: Publish module
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          # PowerShellGet 2.x derives the module name from the leaf folder name
          # when using -Path, so the module must be staged in a folder named
          # after the module (git-aliases), not "src".
          $stagingPath = Join-Path $env:RUNNER_TEMP 'git-aliases'
          New-Item -ItemType Directory -Path $stagingPath -Force | Out-Null
          Copy-Item ./src/* -Destination $stagingPath -Recurse -Force
          Publish-Module -Path $stagingPath -NuGetApiKey $env:PSGALLERY_API_KEY -Force
          Write-Host "Published git-aliases to the PowerShell Gallery."
